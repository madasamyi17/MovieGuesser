name: Build and deploy Node.js app to Azure Web App - movieguesser-production-oauth

on:
  push:
    branches:
      - madasamy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout the repo
      - uses: actions/checkout@v4

      # 2️⃣ Set Node.js version
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      # 3️⃣ Install dependencies, build and test inside backend/backend-2
      - name: npm install, build, and test
        working-directory: backend/backend-2
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      # 4️⃣ Upload the app folder for deployment
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/backend-2

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Download the artifact from build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend/backend-2

      # 2️⃣ Login to Azure
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FA15E66664874BE3A9FDBF401C6450F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_536B342A3B9E439E8E094CF05C6AAC11 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6358CD7868B748C2A633BABEE99EDE53 }}

      # 3️⃣ Deploy the correct folder
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'movieguesser-production-oauth'
          slot-name: 'Production'
          package: backend/backend-2
